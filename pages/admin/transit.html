<section class="page-transit">
    <div data-menu="menu.html"></div>

    <div class="mock-page-head">
        <div class="mock-page-head__title">
            <h1><i class="fa-solid fa-route text-teal"></i> Suivi des bons de sortie</h1>
        </div>
    </div>

    <!-- Liste des transits de tous les BS -->
    <div class="mock-card">
        <div class="mock-card__head">
            <h2 class="mock-card__title"><i class="fa-solid fa-truck-fast"></i> Transits par bon de sortie</h2>
            <span class="chip" id="transit-bs-count">— bons suivis</span>
        </div>
        <div class="mock-card__body">
            <div class="filter-bar mb-2">
                <div class="search-input">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="form-control" data-transits-search
                        placeholder="Filtrer par numéro de bon de sortie…">
                </div>
                <div class="filter-spacer"></div>
                <button class="btn-mock btn-mock--outline btn-mock--sm" type="button" data-transits-search-clear>
                    <i class="fa-solid fa-rotate"></i> Réinitialiser
                </button>
            </div>
            <div class="table-mock-wrap">
                <table class="table-mock" data-bs-summary>
                    <thead>
                        <tr>
                            <th>Bon de sortie</th>
                            <th>Dernier passage</th>
                            <th>Trajet</th>
                            <th>Conformité</th>
                            <th>Anomalie</th>
                            <th class="cell-actions">Parcours</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Modale : parcours d'un BS (ouverte par « Voir le parcours ») -->
    <div class="modal-mock" data-modal="parcours" hidden>
        <div class="modal-mock__backdrop" data-modal-close></div>
        <div class="modal-mock__dialog" role="dialog" aria-modal="true" aria-label="Parcours du bon de sortie"
            style="width:min(100%, 760px);">
            <div class="modal-mock__head">
                <h3 class="modal-mock__title"><i class="fa-solid fa-location-dot text-teal"></i> Parcours construit — <span class="mono" data-parcours-title>—</span></h3>
                <button class="modal-mock__close" type="button" data-modal-close aria-label="Fermer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-mock__body">
                <span class="chip mb-3" data-parcours-count>—</span>
                <div class="table-mock-wrap">
                    <table class="table-mock" data-transits-bs data-count-el="[data-parcours-count]">
                        <thead>
                            <tr>
                                <th>Passage</th>
                                <th>Magasin</th>
                                <th>Agent</th>
                                <th>Date / heure</th>
                                <th>Résultat</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</section>
