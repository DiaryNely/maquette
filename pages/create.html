<section class="create-request">
    <div data-menu="menu.html"></div>
    <h1 class="h3 mb-4">Nouvelle demande</h1>
    <form class="product-request-form">
        <div class="table-responsive">
            <table class="table table-bordered product-request-table">
                <thead>
                    <tr>
                        <th>Type de produit</th>
                        <th>Code</th>
                        <th>Désignation</th>
                        <th>Quantité</th>
                        <th>À rendre</th>
                        <th>Date de retour</th>
                        <th class="text-center">
                            <button class="add-product-line" type="button" data-add-product-line
                                aria-label="Ajouter une ligne" title="Ajouter une ligne">
                                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                            </button>
                        </th>
                    </tr>
                </thead>
                <tbody data-product-lines>
                    <tr class="product-line">
                        <td> <select class="form-control" id="product-type-1" name="product-type[]" required>
                                <option value="" selected disabled>Autres</option>
                                <option>Info</option>
                                <option>Immo</option>
                                <option>Article</option>
                            </select> </td>
                        <td> <input class="form-control" id="product-code-1" name="product-code[]" type="text"
                                placeholder="Ex. ART-001" required> </td>
                        <td> <input class="form-control" id="product-designation-1" name="product-designation[]"
                                type="text" placeholder="Nom du produit" required> </td>
                        <td> <input class="form-control" id="product-quantity-1" name="product-quantity[]" type="number"
                                min="1" value="1" required> </td>
                        <td class="text-center">
                            <div class="custom-control custom-checkbox"> <input class="custom-control-input"
                                    id="product-return-1" name="product-return[]" type="checkbox"> <label
                                    class="custom-control-label" for="product-return-1"> OUI </label> </div>
                        </td>
                        <td> <input class="form-control return-date-input" id="product-return-date-1" name="product-return-date[]"
                                type="date"> </td>
                        <td class="text-center">
                            <button class="remove-product-line" type="button" data-remove-product-line
                                aria-label="Supprimer cette ligne" title="Supprimer cette ligne">
                                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="form-actions">
            <button class="validate-request" type="submit">Valider</button>
        </div>
    </form>

    <!-- TEMPLATE POUR LES NOUVELLES LIGNES --> <template id="product-line-template">
        <tr class="product-line">
            <td> <select class="form-control" name="product-type[]" aria-label="Type de produit" required>
                    <option value="" selected disabled> Sélectionner </option>
                    <option>Matériel informatique</option>
                    <option>Fourniture de bureau</option>
                    <option>Équipement</option>
                </select> </td>
            <td> <input class="form-control" name="product-code[]" type="text" aria-label="Code"
                    placeholder="Ex. ART-001" required> </td>
            <td> <input class="form-control" name="product-designation[]" type="text" aria-label="Désignation"
                    placeholder="Nom du produit" required> </td>
            <td> <input class="form-control" name="product-quantity[]" type="number" aria-label="Quantité" min="1"
                    value="1" required> </td>
            <td class="text-center">
                <div class="custom-control custom-checkbox"> <input class="custom-control-input"
                        id="product-return-__INDEX__" name="product-return[]" type="checkbox"> <label
                        class="custom-control-label" for="product-return-__INDEX__"> Oui </label> </div>
            </td>
                <td> <input class="form-control return-date-input" name="product-return-date[]" type="date"
                    aria-label="Date de retour"> </td>
            <td class="text-center">
                <button class="remove-product-line" type="button" data-remove-product-line
                    aria-label="Supprimer cette ligne" title="Supprimer cette ligne">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </td>
        </tr>
    </template>
</section>
