<section data-bslist>
    <div data-menu="menu.html"></div>

    <div class="mock-page-head">
        <div class="mock-page-head__title">
            <h1><i class="fa-solid fa-file-lines text-teal"></i> Gestion des Bons de Sortie</h1>
        </div>
        <div class="mock-page-head__actions">
            <a href="index.html?page=bs-create" class="btn-mock">
                <i class="fa-solid fa-plus"></i> Nouveau bon de sortie
            </a>
        </div>
    </div>

    <!-- Sous-menus : envoyés / à recevoir -->
    <div class="mock-tabs" data-mock-tabs role="tablist">
        <button class="mock-tab active" data-mock-tab="envoyes" type="button">
            <i class="fa-solid fa-paper-plane"></i> BS envoyés
            <span class="chip chip--active" data-bslist-count data-tab="envoyes">0</span>
        </button>
        <button class="mock-tab" data-mock-tab="recevoir" type="button">
            <i class="fa-solid fa-inbox"></i> BS à recevoir
            <span class="chip chip--active" data-bslist-count data-tab="recevoir">0</span>
        </button>
    </div>

    <!-- ============ BS ENVOYÉS ============ -->
    <div class="mock-panel is-active" data-mock-panel="envoyes" data-bslist-panel>
        <div class="filter-bar">
            <div class="search-input">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="text" class="form-control" data-bslist-search placeholder="Rechercher un BS, un bénéficiaire, un motif…">
            </div>
            <select class="form-control" data-bslist-statut>
                <option value="" selected>Tous les statuts</option>
                <option>Brouillon</option>
                <option>Soumis</option>
                <option>En cours</option>
                <option>Validé</option>
                <option>Refusé</option>
                <option>Annulé</option>
                <option>Clôturé</option>
                <option>Réceptionné</option>
            </select>
            <select class="form-control" data-bslist-retour>
                <option value="tous" selected>Retour attendu : Tous</option>
                <option value="a-rendre">À rendre</option>
                <option value="sans-retour">Sans retour</option>
            </select>
            <input type="date" class="form-control" value="2026-08-01" aria-label="Date de début">
            <input type="date" class="form-control" value="2026-08-12" aria-label="Date de fin">
            <div class="filter-spacer"></div>
            <button class="btn-mock btn-mock--outline btn-mock--sm" data-bslist-reset><i class="fa-solid fa-rotate"></i> Réinitialiser</button>
            <button class="btn-export" type="button" title="Exporter en Excel"><i class="fa-solid fa-file-excel"></i></button>
        </div>

        <div class="table-mock-wrap">
            <table class="table-mock">
                <thead>
                    <tr>
                        <th>N° BS</th>
                        <th>Date</th>
                        <th>Initiateur</th>
                        <th>Magasin initiateur</th>
                        <th>Bénéficiaire</th>
                        <th>Magasin bénéficiaire</th>
                        <th>Retour attendu</th>
                        <th>Motif</th>
                        <th>Statut</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody data-bslist-body data-tab="envoyes"></tbody>
            </table>
        </div>

        <div class="pagination-bar" role="navigation" aria-label="Pagination">
            <div class="pagination-info"><span data-bslist-results data-tab="envoyes">—</span></div>
            <div class="pagination-jump">
                <label for="page-input-env">Allez à la page :</label>
                <input type="text" id="page-input-env" aria-label="Numéro de page">
            </div>
            <div class="pagination-navigation">
                <button class="pagination-arrow" type="button" aria-label="Page précédente" disabled>←</button>
                <span class="pagination-current" aria-current="page">1</span>
                <button class="pagination-arrow" type="button" aria-label="Page suivante">→</button>
            </div>
        </div>
    </div>

    <!-- ============ BS À RECEVOIR ============ -->
    <div class="mock-panel" data-mock-panel="recevoir" data-bslist-panel>
        <div class="filter-bar">
            <div class="search-input">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="text" class="form-control" data-bslist-search placeholder="Rechercher un BS, un initiateur, un motif…">
            </div>
            <select class="form-control" data-bslist-statut>
                <option value="" selected>Tous les statuts</option>
                <option>Brouillon</option>
                <option>Soumis</option>
                <option>En cours</option>
                <option>Validé</option>
                <option>Refusé</option>
                <option>Annulé</option>
                <option>Clôturé</option>
                <option>Réceptionné</option>
            </select>
            <select class="form-control" data-bslist-retour>
                <option value="tous" selected>Retour attendu : Tous</option>
                <option value="a-rendre">À rendre</option>
                <option value="sans-retour">Sans retour</option>
            </select>
            <input type="date" class="form-control" value="2026-08-01" aria-label="Date de début">
            <input type="date" class="form-control" value="2026-08-12" aria-label="Date de fin">
            <div class="filter-spacer"></div>
            <button class="btn-mock btn-mock--outline btn-mock--sm" data-bslist-reset><i class="fa-solid fa-rotate"></i> Réinitialiser</button>
            <button class="btn-export" type="button" title="Exporter en Excel"><i class="fa-solid fa-file-excel"></i></button>
        </div>

        <div class="table-mock-wrap">
            <table class="table-mock">
                <thead>
                    <tr>
                        <th>N° BS</th>
                        <th>Date</th>
                        <th>Initiateur</th>
                        <th>Magasin initiateur</th>
                        <th>Bénéficiaire</th>
                        <th>Magasin bénéficiaire</th>
                        <th>Retour attendu</th>
                        <th>Motif</th>
                        <th>Statut</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody data-bslist-body data-tab="recevoir"></tbody>
            </table>
        </div>

        <div class="pagination-bar" role="navigation" aria-label="Pagination">
            <div class="pagination-info"><span data-bslist-results data-tab="recevoir">—</span></div>
            <div class="pagination-jump">
                <label for="page-input-rec">Allez à la page :</label>
                <input type="text" id="page-input-rec" aria-label="Numéro de page">
            </div>
            <div class="pagination-navigation">
                <button class="pagination-arrow" type="button" aria-label="Page précédente" disabled>←</button>
                <span class="pagination-current" aria-current="page">1</span>
                <button class="pagination-arrow" type="button" aria-label="Page suivante">→</button>
            </div>
        </div>
    </div>

</section>
