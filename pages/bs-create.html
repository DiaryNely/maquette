<section>
    <div data-menu="menu.html"></div>

    <div class="mock-page-head">
        <div class="mock-page-head__title">
            <h1><i class="fa-solid fa-plus text-teal"></i> Création d'un bon de sortie</h1>
        </div>
        <div class="mock-page-head__actions">
            <button type="button" class="btn-mock" data-go-back><i class="fa-solid fa-arrow-left"></i> Retour</button>
        </div>
    </div>

    <form>
        <!-- 1. Informations de l'opération -->
        <div class="mock-card">
            <div class="mock-card__head">
                <h2 class="mock-card__title"><i class="fa-solid fa-file-lines"></i> 1. Informations de l'opération</h2>
            </div>
            <div class="mock-card__body mock-card__body--compact">
                <div class="form-grid-2">
                    <div class="form-grid-2__item">
                        <div class="form-group">
                            <label for="bs-date-souhaitee">Date de sortie souhaitée</label>
                            <input type="date" class="form-control" id="bs-date-souhaitee" value="2026-08-14">
                        </div>
                    </div>
                    <div class="form-grid-2__item">
                        <div class="form-group">
                            <label for="bs-commentaire">Commentaire (facultatif)</label>
                            <input type="text" class="form-control" id="bs-commentaire"
                                placeholder="Précisions utiles pour la validation…">
                        </div>
                    </div>

                    <!-- Magasin destinataire (unique pour tout le BS) -->
                    <div class="form-grid-2__item">
                        <div class="form-group">
                            <label for="bs-magasin-destination">Magasin destinataire</label>
                            <select class="form-control" id="bs-magasin-destination" required>
                                <option value="" selected>— Choisir un magasin —</option>
                                <option>Siège - Administration S2M</option>
                                <option>Magasin central</option>
                                <option>Entrepôt S2M</option>
                                <option>Plateforme logistique</option>
                                <option>Poste de contrôle</option>
                                <option>Barrière de sortie</option>
                            </select>
                        </div>
                    </div>

                    <!-- Bénéficiaire unique (filtré par le magasin destinataire) -->
                    <div class="form-grid-2__item">
                        <div class="form-group">
                            <label for="bs-beneficiaire">Bénéficiaire</label>
                            <div class="ach-row">
                                <div class="ach-search" data-bs-beneficiary-search>
                                    <input type="text" class="form-control" id="bs-beneficiaire"
                                        placeholder="Rechercher le bénéficiaire…" autocomplete="off"
                                        data-bs-beneficiary-input readonly>
                                    <ul class="personnel-search__list" data-bs-beneficiary-list role="listbox" hidden></ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Moyen d'acheminement : recherche + suggestions, bouton Ajouter -->
                    <div class="form-grid-2__item form-grid-2__item--full">
                        <div class="form-group">
                            <label for="bs-acheminement">Moyen d'acheminement</label>
                            <div class="ach-row">
                                <div class="ach-search" data-ach-search>
                                    <input type="text" class="form-control" id="bs-acheminement"
                                        placeholder="Rechercher un moyen d'acheminement…" autocomplete="off"
                                        data-ach-input>
                                    <ul class="personnel-search__list" data-ach-list role="listbox" hidden></ul>
                                </div>
                                <button class="btn-mock" type="button" data-ach-add
                                    title="Ajouter un nouveau moyen d'acheminement">
                                    <i class="fa-solid fa-plus"></i> Ajouter
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Panneau : nouveau moyen d'acheminement -->
                    <div class="form-grid-2__item form-grid-2__item--full" data-ach-new hidden>
                        <div class="ach-new">
                            <div class="form-grid-2">
                                <div class="form-grid-2__item">
                                    <div class="form-group">
                                        <label for="ach-nom-complet">Nom complet</label>
                                        <input type="text" class="form-control" id="ach-nom-complet"
                                            placeholder="Nom du transporteur ou de la société">
                                    </div>
                                </div>
                                <div class="form-grid-2__item">
                                    <div class="form-group">
                                        <label for="ach-contact">Contact</label>
                                        <input type="text" class="form-control" id="ach-contact"
                                            placeholder="Téléphone ou e-mail">
                                    </div>
                                </div>
                                <div class="form-grid-2__item">
                                    <div class="form-group">
                                        <label for="ach-transport">Moyen de transport</label>
                                        <input type="text" class="form-control" id="ach-transport"
                                            placeholder="Ex. Camion S2M, Moto…">
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex flex-wrap" style="gap:10px; margin-top:14px;">
                                <button class="btn-mock btn-mock--sm" type="button" data-ach-save>
                                    <i class="fa-solid fa-check"></i> Enregistrer le moyen
                                </button>
                                <button class="btn-mock btn-mock--outline btn-mock--sm" type="button" data-ach-cancel>
                                    Annuler
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Articles et destinataires -->
        <div class="mock-card">
            <div class="mock-card__head">
                <div>
                    <h2 class="mock-card__title"><i class="fa-solid fa-boxes-stacked"></i> 2. Articles</h2>
                </div>
                <button class="btn-mock btn-mock--sm" type="button" data-add-product-line>
                    <i class="fa-solid fa-plus"></i> Ajouter un article
                </button>
            </div>
            <div class="mock-card__body mock-card__body--flush">
                <div class="table-responsive">
                    <table class="table-mock table-mock--products" style="min-width: 1350px;">
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Code</th>
                                <th>Désignation</th>
                                <th>Quantité</th>
                                <th>État</th>
                                <th>À rendre</th>
                                <th>Date de retour prévue</th>
                                <th class="text-center">
                                    <button class="btn-add-row" type="button" data-add-product-line
                                        title="Ajouter une ligne" aria-label="Ajouter une ligne">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </th>
                            </tr>
                        </thead>
                        <tbody data-product-lines>
                            <tr class="product-line">
                                <td>
                                    <select class="form-control form-control-sm" name="product-type[]">
                                        <option value="">Autre</option>
                                        <option>Article</option>
                                        <option>Info</option>
                                        <option>Immo</option>
                                        <option>Fourniture</option>
                                    </select>
                                </td>
                                <td><input class="form-control form-control-sm" name="product-code[]" value="ART-102"
                                        placeholder="Ex. ART-001"></td>
                                <td><input class="form-control form-control-sm" name="product-designation[]"
                                        value="Rame papier A4 80 g (paquet de 500)"></td>
                                <td><input class="form-control form-control-sm" name="product-quantity[]" type="number"
                                        min="1" value="10"></td>
                                <td>
                                    <select class="form-control form-control-sm" name="product-state[]">
                                        <option selected>Neuf</option>
                                        <option>Bon état</option>
                                        <option>Usage</option>
                                        <option>À réformer</option>
                                    </select>
                                </td>
                                <td class="text-center">
                                    <div class="custom-control custom-checkbox">
                                        <input class="custom-control-input" id="product-return-1"
                                            name="product-return[]" type="checkbox">
                                        <label class="custom-control-label" for="product-return-1">OUI</label>
                                    </div>
                                </td>
                                <td><input class="form-control form-control-sm return-date-input"
                                        name="product-return-date[]" type="date"></td>
                                <td class="text-center">
                                    <button class="btn-remove-row" type="button" data-remove-product-line
                                        aria-label="Supprimer cette ligne" title="Supprimer cette ligne">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr class="product-line">
                                <td>
                                    <select class="form-control form-control-sm" name="product-type[]">
                                        <option>Article</option>
                                        <option selected>Info</option>
                                        <option>Immo</option>
                                        <option>Fourniture</option>
                                        <option value="">Autre</option>
                                    </select>
                                </td>
                                <td><input class="form-control form-control-sm" name="product-code[]" value="MAT-011">
                                </td>
                                <td><input class="form-control form-control-sm" name="product-designation[]"
                                        value="Écran 24&quot; Dell P2422H"></td>
                                <td><input class="form-control form-control-sm" name="product-quantity[]" type="number"
                                        min="1" value="2"></td>
                                <td>
                                    <select class="form-control form-control-sm" name="product-state[]">
                                        <option>Neuf</option>
                                        <option selected>Bon état</option>
                                        <option>Usage</option>
                                        <option>À réformer</option>
                                    </select>
                                </td>
                                <td class="text-center">
                                    <div class="custom-control custom-checkbox">
                                        <input class="custom-control-input" id="product-return-2"
                                            name="product-return[]" type="checkbox" checked>
                                        <label class="custom-control-label" for="product-return-2">OUI</label>
                                    </div>
                                </td>
                                <td><input class="form-control form-control-sm return-date-input is-visible"
                                        name="product-return-date[]" type="date" value="2026-09-12"></td>
                                <td class="text-center">
                                    <button class="btn-remove-row" type="button" data-remove-product-line
                                        aria-label="Supprimer cette ligne" title="Supprimer cette ligne">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TEMPLATE POUR LES NOUVELLES LIGNES D'ARTICLES -->
        <template id="product-line-template">
            <tr class="product-line">
                <td>
                    <select class="form-control form-control-sm" name="product-type[]">
                        <option value="" selected>Article</option>
                        <option>Info</option>
                        <option>Immo</option>
                        <option>Fourniture</option>
                    </select>
                </td>
                <td><input class="form-control form-control-sm" name="product-code[]" placeholder="Ex. ART-001"></td>
                <td><input class="form-control form-control-sm" name="product-designation[]"
                        placeholder="Nom du produit"></td>
                <td><input class="form-control form-control-sm" name="product-quantity[]" type="number" min="1"
                        value="1"></td>
                <td>
                    <select class="form-control form-control-sm" name="product-state[]">
                        <option>Neuf</option>
                        <option>Bon état</option>
                        <option>Usage</option>
                        <option>À réformer</option>
                    </select>
                </td>
                <td class="text-center">
                    <div class="custom-control custom-checkbox">
                        <input class="custom-control-input" id="product-return-__INDEX__" name="product-return[]"
                            type="checkbox">
                        <label class="custom-control-label" for="product-return-__INDEX__">OUI</label>
                    </div>
                </td>
                <td><input class="form-control form-control-sm return-date-input" name="product-return-date[]"
                        type="date"></td>
                <td class="text-center">
                    <button class="btn-remove-row" type="button" data-remove-product-line
                        aria-label="Supprimer cette ligne" title="Supprimer cette ligne">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </td>
            </tr>
        </template>
        
        <!-- Actions -->
        <div class="d-flex justify-content-center" style="margin-bottom: 28px;">
            <button class="btn-mock" type="submit"><i class="fa-solid fa-paper-plane"></i> Valider</button>
        </div>
    </form>
</section>
